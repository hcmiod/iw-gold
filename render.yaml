services:
  - type: web
    name: iw-gold
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  - type: worker
    name: iw-gold-worker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npx tsx workers/send-worker.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
databases:
  - name: iw-gold-db
    plan: free
